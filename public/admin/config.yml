        required: true
      - label: Secondary label
        name: secondary_label
        widget: string
        required: true
      - label: Secondary target
        name: secondary_target
        widget: string
        hint: 'Section or service ID without #. Built-ins: home, services, approach,
          questions, contact.'
        required: true
      - label: Note
        name: note
        widget: text
        required: true
      required: true
    - label: Hero showcase
      name: hero_showcase
      widget: object
      collapsed: true
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: true
      - label: Location
        name: location
        widget: string
        required: true
      - label: Heading
        name: heading
        widget: text
        required: true
      - label: Accent
        name: accent
        widget: string
        required: true
      - label: Footer
        name: footer
        widget: string
        required: true
      - label: Link label
        name: link_label
        widget: string
        required: true
      - label: Link target
        name: link_target
        widget: string
        hint: 'Section or service ID without #. Built-ins: home, services, approach,
          questions, contact.'
        required: true
      - label: Items
        name: items
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Heading
          name: heading
          widget: text
          required: true
        - label: Description
          name: description
          widget: text
          required: true
        - label: Icon
          name: icon
          widget: select
          options:
          - tv
          - home
          - wifi
          - camera
          - audio
          - tools
          - shelf
          - window
          - door
          - paint
          - outlet
          - faucet
          required: true
        - label: Target
          name: target
          widget: string
          hint: 'Section or service ID without #. Built-ins: home, services, approach,
            questions, contact.'
          required: true
      required: true
