        widget: string
        required: true
      - label: Faq description
        name: faq_description
        widget: string
        required: true
      - label: Faqs
        name: faqs
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Question
          name: question
          widget: string
          required: true
        - label: Answer
          name: answer
          widget: text
          required: true
      required: true
    - label: Contact
      name: contact
      widget: object
      collapsed: true
      fields:
      - label: Text label
        name: text_label
        widget: string
        required: true
      - label: Heading
        name: heading
        widget: text
        required: true
      - label: Email subject
        name: email_subject
        widget: string
        required: true
      - label: Eyebrow
