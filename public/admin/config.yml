  - name: services
    label: Services, descriptions & bullet lists
    file: public/data/services.json
    format: json
    fields:
    - label: Schema version
      name: schema_version
      widget: hidden
      default: 1
    - label: Groups
      name: groups
      widget: list
      collapsed: true
      required: false
      summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
      hint: Add, remove or drag entries to reorder.
      fields:
      - label: Id
        name: id
        widget: string
        pattern:
        - ^[a-z0-9]+(-[a-z0-9]+)*$
        - Use unique lowercase words joined with hyphens.
        hint: Keep this anchor stable after publishing.
        required: true
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: true
      - label: Heading
        name: heading
        widget: text
        required: true
      - label: Description
        name: description
        widget: text
        required: true
      - label: Visible
        name: visible
        widget: boolean
        default: true
        required: true
      - label: Items
        name: items
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Id
          name: id
          widget: string
          pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Use unique lowercase words joined with hyphens.
          hint: Keep this anchor stable after publishing.
          required: true
        - label: Title
          name: title
          widget: string
          required: true
        - label: Tagline
          name: tagline
          widget: string
          required: true
        - label: Description
          name: description
          widget: text
          required: true
        - label: Bullets
