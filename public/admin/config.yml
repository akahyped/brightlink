        fields:
        - label: Text
          name: text
          widget: string
          required: true
      - label: Illustration label
        name: illustration_label
        widget: string
        required: true
      - label: Hub icon
        name: hub_icon
        widget: select
        options:
        - tv
        - home
        - wifi
        - camera
        - audio
        - tools
        - shelf
        - window
        - door
        - paint
        - outlet
        - faucet
        required: true
      - label: Nodes
        name: nodes
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Icon
          name: icon
          widget: select
          options:
          - tv
          - home
          - wifi
          - camera
          - audio
          - tools
          - shelf
          - window
          - door
          - paint
          - outlet
          - faucet
          required: true
        - label: Label
          name: label
          widget: string
          required: true
      required: true
    - label: Approach
      name: approach
      widget: object
      collapsed: true
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: true
      - label: Heading
        name: heading
        widget: text
        required: true
      - label: Steps
        name: steps
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Heading
          name: heading
          widget: text
          required: true
        - label: Description
          name: description
          widget: text
          required: true
        - label: Label
          name: label
          widget: string
          required: true
      required: true
    - label: Experience
      name: experience
      widget: object
      collapsed: true
