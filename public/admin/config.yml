      name: service_strip
      widget: list
      collapsed: true
      required: false
      summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
      hint: Add, remove or drag entries to reorder.
      fields:
      - label: Text
        name: text
        widget: string
        required: true
    - label: Feature
      name: feature
      widget: object
      collapsed: true
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: true
      - label: Heading
        name: heading
        widget: text
        required: true
      - label: Paragraphs
        name: paragraphs
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
