          widget: list
          collapsed: true
          required: false
          summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
          hint: Add, remove or drag entries to reorder.
          fields:
          - label: Text
            name: text
            widget: string
            required: true
        - label: Icon
          name: icon
          widget: select
          options:
          - tv
          - home
          - wifi
          - camera
          - audio
          - tools
          - shelf
          - window
          - door
          - paint
          - outlet
          - faucet
          required: true
        - label: Visible
          name: visible
          widget: boolean
          default: true
          required: true
        - label: Photo
          name: photo
          widget: image
          choose_url: false
          required: false
        - label: Photo alt
          name: photo_alt
          widget: string
          required: false
        - label: Link label
          name: link_label
          widget: string
          required: true
        - label: Link target
          name: link_target
          widget: string
          hint: 'Section or service ID without #. Built-ins: home, services, approach,
            questions, contact.'
          required: true
