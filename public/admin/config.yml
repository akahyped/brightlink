        fields:
        - label: Text
          name: text
          widget: string
          required: true
      - label: Tags
        name: tags
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
