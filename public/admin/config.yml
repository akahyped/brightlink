backend:
  name: github
  repo: akahyped/brightlink
  branch: main
  base_url: https://brightlinkcle.com
  auth_endpoint: api/auth
  auth_scope: public_repo
site_url: https://brightlinkcle.com
display_url: https://brightlinkcle.com
media_folder: public/uploads
public_folder: /uploads
publish_mode: simple
editor:
  preview: false
collections:
- name: brightlink
  label: BrightLink website
  files:
  - name: site
    label: Page content, branding & contact
    file: public/data/site.json
    format: json
    fields:
    - label: Schema version
      name: schema_version
      widget: hidden
      default: 1
    - label: Seo
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Title
        name: title
        widget: string
        required: true
      - label: Description
        name: description
        widget: text
        required: true
      - label: Language
        name: language
        widget: string
        required: true
      - label: Canonical url
        name: canonical_url
        widget: string
        required: true
      - label: Social image
        name: social_image
        widget: image
        choose_url: false
        required: false
      required: true
    - label: Brand
      name: brand
      widget: object
      collapsed: true
      fields:
      - label: Name
        name: name
        widget: string
        required: true
      - label: Subtitle
        name: subtitle
        widget: string
        required: true
      - label: Logo
        name: logo
        widget: image
        choose_url: false
        required: false
      - label: Logo alt
        name: logo_alt
        widget: string
        required: true
      required: true
    - label: Navigation
      name: navigation
      widget: list
      collapsed: true
      required: false
      summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
      hint: Add, remove or drag entries to reorder.
      fields:
      - label: Label
        name: label
        widget: string
        required: true
      - label: Target
        name: target
        widget: string
        hint: 'Section or service ID without #. Built-ins: home, services, approach,
          questions, contact.'
        required: true
    - label: Header button
      name: header_button
      widget: object
      collapsed: true
      fields:
      - label: Label
        name: label
        widget: string
        required: true
      - label: Target
        name: target
        widget: string
        hint: 'Section or service ID without #. Built-ins: home, services, approach,
          questions, contact.'
        required: true
      required: true
    - label: Hero
      name: hero
      widget: object
      collapsed: true
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: true
      - label: Heading lines
        name: heading_lines
        widget: list
        collapsed: true
        required: false
        summary: '{{fields.title}}{{fields.heading}}{{fields.label}}{{fields.text}}{{fields.question}}'
        hint: Add, remove or drag entries to reorder.
        fields:
        - label: Text
          name: text
          widget: string
          required: false
        - label: Emphasized text
          name: emphasized_text
          widget: string
          required: false
      - label: Service summary
        name: service_summary
        widget: text
        required: true
      - label: Description
        name: description
        widget: text
        required: true
      - label: Primary label
        name: primary_label
        widget: string
        required: true
      - label: Primary target
        name: primary_target
        widget: string
        hint: 'Section or service ID without #. Built-ins: home, services, approach,
